<svg xmlns="http://www.w3.org/2000/svg" width="880" height="656" viewBox="0 0 880 656" role="img" aria-label="Архитектура Zorky: камеры, воркер, бэкенд API, веб" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;font-variant-numeric:tabular-nums">
