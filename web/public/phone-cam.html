<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1012" />
    <title>Камера телефона</title>
    <style>
      :root { color-scheme: dark; --bg: #0d1012; --surface: #151a1d; --text: #edf1f3; --muted: #85919a; --accent: #b8e62e; --bad: #ff5a5f; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
      h1 { margin: 0; font-size: 20px; }
      video { width: 100%; border-radius: 12px; background: #000; aspect-ratio: 4 / 3; object-fit: cover; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
      label { display: grid; gap: 4px; color: var(--muted); font-size: 13px; }
      input, select, button { min-height: 44px; border-radius: 10px; border: 1px solid #2c343a; background: var(--surface); color: var(--text); padding: 0 12px; font: inherit; }
      button { background: var(--accent); color: #0d1012; font-weight: 700; border: 0; }
      button.stop { background: var(--bad); color: #fff; }
      .stats { color: var(--muted); font-size: 14px; }
      .error { color: var(--bad); }
    </style>
  </head>
  <body>
    <main>
      <h1>Камера телефона</h1>
      <video id="video" playsinline muted autoplay></video>
      <div class="row">
        <label>Камера в системе
          <input id="camera" value="phone-1" size="10" autocapitalize="off" />
        </label>
        <label>Какая камера
          <select id="facing"><option value="environment">Основная</option><option value="user">Фронтальная</option></select>
        </label>
        <label>Кадров/с
          <select id="fps"><option>2</option><option selected>5</option><option>10</option></select>
        </label>
        <button id="toggle" type="button">Включить</button>
      </div>
      <p class="stats" id="stats">Не запущено. Нужен вход в систему (администратор или оператор) в этом же браузере.</p>
      <p class="error" id="error"></p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let stream = null;
      let timer = null;
      let sent = 0;
      let failed = 0;
      let started = 0;

      // в демо-режиме входим сами (оператор), если сессии ещё нет: без пароля и без лишних кликов
      async function ensureLogin() {
        try {
          if ((await fetch("/api/auth/me", { credentials: "same-origin" })).ok) return;
          const roles = await (await fetch("/api/auth/demo")).json();
          const pick = roles.find((r) => r.role === "operator") || roles.find((r) => r.role === "admin");
          if (pick) {
            await fetch("/api/auth/demo", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ login: pick.login }),
              credentials: "same-origin",
            });
          }
        } catch (e) {
          /* без сети или не демо: оставляем как есть, ошибка покажется при отправке */
        }
      }

      async function start() {
        $("error").textContent = "";
        await ensureLogin();
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: $("facing").value, width: { ideal: 1280 }, height: { ideal: 720 } },
            audio: false,
          });
        } catch (e) {
          $("error").textContent = "Нет доступа к камере: " + e.message + " (страница должна открываться как localhost или по HTTPS)";
          return;
        }
        $("video").srcObject = stream;
        const canvas = document.createElement("canvas");
        sent = failed = 0;
        started = Date.now();
        let busy = false;
        timer = setInterval(async () => {
          const v = $("video");
          if (busy || !v.videoWidth) return;
          busy = true;
          try {
            const w = Math.min(960, v.videoWidth);
            canvas.width = w;
            canvas.height = Math.round((v.videoHeight / v.videoWidth) * w);
            canvas.getContext("2d").drawImage(v, 0, 0, canvas.width, canvas.height);
            const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.7));
            const res = await fetch(`/api/phone/${encodeURIComponent($("camera").value.trim())}/frame`, {
              method: "POST",
              headers: { "Content-Type": "image/jpeg" },
              body: blob,
              credentials: "same-origin",
            });
            if (res.status === 204) sent++;
            else {
              failed++;
              $("error").textContent = res.status === 401 || res.status === 403 ? "Войдите в систему как администратор или оператор и обновите страницу." : "Сервер ответил " + res.status;
            }
          } catch (e) {
            failed++;
            $("error").textContent = "Нет связи с бэкендом";
          } finally {
            busy = false;
            const sec = Math.max(1, (Date.now() - started) / 1000);
            $("stats").textContent = `Отправлено кадров: ${sent} (${(sent / sec).toFixed(1)}/с), ошибок: ${failed}`;
          }
        }, 1000 / Number($("fps").value));
        $("toggle").textContent = "Выключить";
        $("toggle").className = "stop";
      }

      function stop() {
        clearInterval(timer);
        stream?.getTracks().forEach((t) => t.stop());
        stream = null;
        $("video").srcObject = null;
        $("toggle").textContent = "Включить";
        $("toggle").className = "";
      }

      // параметры в адресе: ?facing=user&camera=phone-2&fps=10&auto=1 (auto — включить сразу)
      const params = new URLSearchParams(location.search);
      if (params.get("facing")) $("facing").value = params.get("facing");
      if (params.get("camera")) $("camera").value = params.get("camera");
      if (params.get("fps")) $("fps").value = params.get("fps");
      $("toggle").addEventListener("click", () => (stream ? stop() : start()));
      if (params.get("auto") === "1") start();
    </script>
  </body>
</html>
