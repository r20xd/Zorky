# HTTPS на 8443 (в контейнере 443), HTTP на 80 -> редирект на HTTPS.
# Сертификат делает `py tasks.py cert` в ~/.mosprom/certs, compose монтирует его в /certs.
server {
  listen 80;
  return 301 https://$host:8443$request_uri;
}

server {
  listen 443 ssl;
  ssl_certificate /certs/cert.pem;
  ssl_certificate_key /certs/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /usr/share/nginx/html;

  # add_header только на уровне server: в location он сбросил бы унаследованные
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;      # живая лента (SSE) и превью идут потоком
    proxy_read_timeout 1h;
    client_max_body_size 10m;
  }

  location / {
    try_files $uri /index.html;
  }
}
